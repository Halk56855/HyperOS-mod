name: Build and Release APK/Magisk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (لأدوات توقيع ومعالجة APK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. مثال على خطوة معالجة أو توقيع الملفات (يمكن تعديلها حسب رغبتك)
      - name: Prepare Files
        run: |
          echo "Preparing files for release..."
          mkdir -p output
          # يمكنك وضع أوامر هنا لتعديل أو ضغط الملفات، مثلاً إذا كان لديك ملف settings.apk في المستودع
          if [ -f "settings.apk" ]; then
            cp settings.apk output/settings_mod.apk
          fi

      # 4. رفع الملفات التلقائي إلى قسم Releases
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          name: "HyperOS Settings Mod v0.1-${{ github.run_number }}"
          draft: false
          prerelease: true
          files: |
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
