name: Build PowerKeeper Magisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download PowerKeeper APK from Google Drive
        run: |
          echo "Installing gdown..."
          pip install --no-cache-dir gdown
          
          echo "Downloading powerkeeper.apk from Google Drive..."
          # استخدام رابط التنزيل المباشر أو المعرف مباشرة بدون --fuzzy
          gdown "https://drive.google.com/uc?id=1y30BLcDnolAz-T7W8VaPyP1cHL6T4RmH" -O powerkeeper.apk

          # التحقق من أن الملف تم تحميله وأن حجمه الحقيقي أكبر من 2 ميغابايت
          if [ -f "powerkeeper.apk" ]; then
            FILE_SIZE=$(stat -c%s "powerkeeper.apk")
            echo "Downloaded file size in bytes: $FILE_SIZE"
            if [ "$FILE_SIZE" -lt 2000000 ]; then
              echo "Error: File is too small or download failed! (Check if Google Drive link is public)"
              exit 1
            fi
          else
            echo "Error: Failed to download APK!"
            exit 1
          fi

      - name: Prepare Magisk Module Structure
        run: |
          echo "Creating Magisk module directory structure for PowerKeeper..."
          mkdir -p magisk_module/system/priv-app/PowerKeeper
          mkdir -p output

          cp powerkeeper.apk magisk_module/system/priv-app/PowerKeeper/PowerKeeper.apk

          cat << 'EOF' > magisk_module/module.prop
          id=hyperos-powerkeeper-mod
          name=HyperOS PowerKeeper Mod
          version=v0.1
          versionCode=1
          author=Halk56855
          description=Custom PowerKeeper app mod for HyperOS
          EOF

          echo "Zipping Magisk module..."
          cd magisk_module
          zip -r ../output/HyperOS-PowerKeeper-Module.zip .
          cd ..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: powerkeeper-v0.1-${{ github.run_number }}
          name: "HyperOS PowerKeeper Magisk Module v0.1-${{ github.run_number }}"
          draft: false
          prerelease: true
          files: |
            output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
