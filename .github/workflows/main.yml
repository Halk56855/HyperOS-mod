name: Build Magisk Module from Google Drive

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK from Google Drive
        run: |
          echo "Downloading settings.apk from Google Drive..."
          FILE_ID="1oHPKRIkku0MqGvLtQX00gUYEcdjfGeId"
          
          # أمر تحميل الملفات الكبيرة من Google Drive عبر الـ API العام
          curl -c ./cookie -s -L "https://drive.google.com/uc?export=download&id=${FILE_ID}" > /dev/null
          CONFIRM=$(awk '/_warning_/ {print $NF}' ./cookie)
          
          if [ -z "$CONFIRM" ]; then
            curl -Lb ./cookie "https://drive.google.com/uc?export=download&confirm=t&id=${FILE_ID}" -o settings.apk
          else
            curl -Lb ./cookie "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o settings.apk
          fi

          # التحقق من أن الملف تم تحميله بنجاح وأن حجمه طبيعي
          if [ -f "settings.apk" ] && [ -s "settings.apk" ]; then
            echo "Download completed successfully. File size:"
            ls -lh settings.apk
          else
            echo "Error: Failed to download APK from Google Drive!"
            exit 1
          fi

      - name: Prepare Magisk Module Structure
        run: |
          echo "Creating Magisk module directory structure..."
          mkdir -p magisk_module/system/priv-app/Settings
          mkdir -p output

          cp settings.apk magisk_module/system/priv-app/Settings/settings.apk

          cat << 'EOF' > magisk_module/module.prop
          id=hyperos-settings-mod
          name=HyperOS Settings Mod
          version=v0.1
          versionCode=1
          author=Halk56855
          description=Custom Settings app mod for HyperOS
          EOF

          cd magisk_module
          zip -r ../output/HyperOS-Settings-Module.zip .
          cd ..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          name: "HyperOS Settings Magisk Module v0.1-${{ github.run_number }}"
          draft: false
          prerelease: true
          files: |
            output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
