name: Build Magisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Magisk Module Structure
        run: |
          echo "Creating Magisk module directory structure..."
          mkdir -p magisk_module/system/priv-app/Settings
          mkdir -p output

          # التأكد من وجود ملف settings.apk ونسخه للمسار الصحيح داخل الموديول
          if [ -f "settings.apk" ]; then
            cp settings.apk magisk_module/system/priv-app/Settings/settings.apk
            echo "settings.apk copied successfully."
          else
            echo "Error: settings.apk not found!"
            exit 1
          fi

          # إنشاء ملف module.prop الإلزامي لأي موديول Magisk
          cat << 'EOF' > magisk_module/module.prop
          id=hyperos-settings-mod
          name=HyperOS Settings Mod
          version=v0.1
          versionCode=1
          author=Halk56855
          description=Custom Settings app mod for HyperOS
          EOF

          # ضغط المجلد بصيغة zip ليصبح موديول جاهز للتثبيت
          cd magisk_module
          zip -r ../output/HyperOS-Settings-Module.zip .
          cd ..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          name: "HyperOS Settings Magisk Module v0.1-${{ github.run_number }}"
          draft: false
          prerelease: true
          files: |
            output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
