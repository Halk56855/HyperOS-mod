name: Build Magisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download APK from Google Drive using gdown
        run: |
          echo "Installing gdown..."
          pip install gdown
          
          echo "Downloading settings.apk from Google Drive..."
          gdown "1-bgXLoEQgSj3QKepX1IPODmbb8AHOLg2" -O settings.apk

          # التحقق من أن الملف تم تحميله وأن حجمه الحقيقي كبير (أكثر من 10 ميغابايت)
          if [ -f "settings.apk" ]; then
            FILE_SIZE=$(stat -c%s "settings.apk")
            echo "Downloaded file size in bytes: $FILE_SIZE"
            if [ "$FILE_SIZE" -lt 10000000 ]; then
              echo "Error: File is too small or download failed!"
              exit 1
            fi
          else
            echo "Error: Failed to download APK!"
            exit 1
          fi

      - name: Prepare Magisk Module Structure
        run: |
          echo "Creating Magisk module directory structure..."
          mkdir -p magisk_module/system/priv-app/Settings
          mkdir -p output

          cp settings.apk magisk_module/system/priv-app/Settings/settings.apk

          cat << 'EOF' > magisk_module/module.prop
          id=hyperos-settings-mod
          name=HyperOS Settings Mod
          version=v0.1
          versionCode=1
          author=Halk56855
          description=Custom Settings app mod for HyperOS
          EOF

          cd magisk_module
          zip -r ../output/HyperOS-Settings-Module.zip .
          cd ..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          name: "HyperOS Settings Magisk Module v0.1-${{ github.run_number }}"
          draft: false
          prerelease: true
          files: |
            output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
